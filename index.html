<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SmartJob Demo</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f7fb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-container {
            display: flex;
            background: #fff;
            box-shadow: 0 18px 45px rgba(15, 23, 42, 0.16);
            border-radius: 10px;
            overflow: hidden;
            width: min(80%, 1200px);
        }

        .login-left {
            flex: 1;
            background: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-left img {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
        }

        .login-right {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            color: #0f766e;
            font-weight: 700;
        }

        .brand img {
            width: 44px;
            height: 44px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #555;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
        }

        .btn {
            background-color: #0f766e;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-left">
            <img src="public/img/login-illustration.svg" alt="SmartJob Demo illustration">
        </div>
        <div class="login-right">
            <div class="brand">
                <img src="public/img/brand-mark.svg" alt="SmartJob Demo logo">
                <span>SmartJob Demo</span>
            </div>
            <h1>เข้าสู่ระบบ</h1>
            <p>ระบบตัวอย่างสำหรับจัดการข้อมูลผู้สมัครงานและสถานประกอบการ</p>
            <form>
                <div class="form-group">
                    <label for="username">ชื่อผู้ใช้งาน</label>
                    <input type="text" id="username" name="username" placeholder="กรอกชื่อผู้ใช้งาน">
                </div>
                <div class="form-group">
                    <label for="password">รหัสผ่าน</label>
                    <input type="password" id="password" name="password" placeholder="กรอกรหัสผ่าน">
                </div>
                <button type="submit" class="btn">เข้าสู่ระบบ</button>
            </form>
        </div>
    </div>
</body>
</html>
